name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      # Pure geometry: circle/rect/capsule intersection, SAT, segment crossing.
      # Fast, deterministic, no simulation.
      - name: Geometry
        run: python -m tests.test_geometry

      # The correction layer. Turns every noise and delay source OFF and
      # requires the belief to reproduce ground truth to sub-millimetre, which
      # is the test that catches estimator bugs invisible under normal noise.
      - name: Estimator
        run: python -m tests.test_estimator

      # The portability claim, enforced: ai/ must not import ground truth or
      # the match harness, Agent must take injected Sensors/Actuators, and a
      # full match must run with no ground-truth handle at all.
      - name: Architecture
        run: python -m tests.test_architecture

      # A real match end to end. Catches anything that imports, type-checks and
      # passes unit tests but cannot actually play -- which has happened.
      - name: Smoke match
        run: python -m tools.arena --matches 1 --seconds 30

      # The renderer imports tkinter, which is absent on CI runners. Importing
      # the module must still work; only constructing a window would not.
      - name: Entry points import
        run: |
          python -c "import config, motors"
          python -c "import ai.agent, ai.estimator, ai.strategy_mpc, ai.tactics"
          python -c "import tools.arena, tools.sweep, tools.verify, tools.census"
